<!DOCTYPE html>
<html lang="en">

  <title>Tailwind Landing Page</title>

<body class="bg-[url('BK-LGT.jpg')] bg-cover justify-center item-center shrink-0">

    <main class="relative z-10 px-1 mt-5">

        <h4>
          <span class="font-bold">Graphics</span>Family
        </h4>
        <nav class="flex flex-nowrap items-center gap-5 text-white ml-auto">

            <ul class="flex items-center gap-4">
              <li><a href="#">About</a></li>
              <li><a href="#">Designer</a></li>
              <li><a href="#">Features</a></li>
              <li><a href="#">News</a></li>
            </ul>
            <button style="font-size:24px whitespace-nowrap"><i class="fa fa-search"> SIGN UP</i></button>

      </header>

      <section class="flex-col gap-2 py-15">

            Creative

          </p>

          <p class=" mt-2">
            <a href="www.graphicsfamily.com" class="text-blue-900 ">www.graphicsfamily.com</a>
          </p>
        
          <div class="flex md:flex-row md:gap-9 items-center justify-between">
            <div class="row flex gap-4 ">
              <i class="fa fa-youtube-play border-2 rounded-full"></i>
              <i class="fa fa-twitter border-2 rounded-full"></i>

            </div>
